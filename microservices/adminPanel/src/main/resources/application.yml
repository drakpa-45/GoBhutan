# logging
logging:
  level:
    root: INFO
    com.goBhutan.adminPanel: DEBUG

#Swagger
springdoc:
  swagger-ui:
    path: /docs
    display-request-duration: true
    operations-sorter: method   # or "alpha"
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

  group-configs:
    - group: bus-admin
      packages-to-scan: com.goBhutan.adminPanel.busAdmin.controller
    - group: payment-int
      packages-to-scan: com.goBhutan.adminPanel.paymentInt.controller
    - group: hotel-admin
      packages-to-scan: com.goBhutan.adminPanel.hotel.controller
    - group: common-endpoints
      packages-to-scan: com.goBhutan.adminPanel.common.controller
    - group: theater-admin
      packages-to-scan: com.goBhutan.adminPanel.theater.controller
    

