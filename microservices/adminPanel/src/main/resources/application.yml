# Server Configuration
server:
  port: 8085

spring:
  datasource: # Database Configuration
    url: jdbc:mysql://localhost:3306/goBhutan?useSSL=false&allowPublicKeyRetrieval=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect   # Updated to MySQL8Dialect for modern MySQL
    show-sql: true
  #Spring Security OAuth2 Resource Server (JWT)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8084/realms/Go-Bhutan  # ? Keycloak realm issuer

# Multiple client configs
app:
  clients:
    hotel:
      jwt: # JWT Role Converter
        auth:
          converter:
            resource-id: hotel-admin-rest-api    # ? must match Keycloak client-id that has roles
            principle-attribute: preferred_username   # JWT claim to use as principal username
      keycloak: # Keycloak Admin Client (for backend management)
        serverUrl: http://localhost:8084  # Keycloak server URL
        realm: Go-Bhutan # Keycloak realm
        admin:
          clientId: hotel-admin-client
          clientSecret: QunAYZb7yPSV3hUi77cEvzQobDbHRbyO
    theater:
      jwt: # JWT Role Converter
        auth:
          converter:
            resource-id: theater-admin-rest-api    # ? must match Keycloak client-id that has roles
            principle-attribute: preferred_username   # JWT claim to use as principal username
      keycloak: # Keycloak Admin Client (for backend management)
        serverUrl: http://localhost:8084  # Keycloak server URL
        realm: Go-Bhutan # Keycloak realm
        admin:
          clientId: theater-admin-client
          clientSecret: d7zknakWJgDEOIb5gvQNQ64cS97G14cT
    bus:
      jwt:
        auth:
          converter:
            resource-id: bus-admin-rest-api
            principle-attribute: preferred_username
      keycloak:
        serverUrl: http://localhost:8084  # Keycloak server URL
        realm: Go-Bhutan # Keycloak realm
        admin:
          clientId: bus-admin-client
          clientSecret: YGVuF6q8Ce0QsDQWTSGe8J8I5489P1tE

# logging
logging:
  level:
    root: INFO
    com.goBhutan.adminPanel: DEBUG

#Swagger
springdoc:
  swagger-ui:
    path: /docs
    display-request-duration: true
    operations-sorter: method   # or "alpha"
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

  group-configs:
    - group: bus-admin
      packages-to-scan: com.goBhutan.adminPanel.busAdmin.controller
    - group: hotel-admin
      packages-to-scan: com.goBhutan.adminPanel.hotel.controller
    - group: common-endpoints
      packages-to-scan: com.goBhutan.adminPanel.common.controller
    - group: theater-admin
      packages-to-scan: com.goBhutan.adminPanel.theater.controller